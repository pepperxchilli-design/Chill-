function windCompassSVG(deg, kmh){
  deg = deg||0;
  const size=120, cx=size/2, cy=size/2, r=44;
  // Meteorological convention: `deg` is the direction the wind is blowing FROM.
  // The arrow should point the way the wind is heading — 180° opposite that bearing.
  const arrowDeg = (deg+180)%360;
  const rad = (arrowDeg-90)*Math.PI/180;
  const dirX = Math.cos(rad), dirY = Math.sin(rad);
  const perpX = -dirY, perpY = dirX;
  // Part 1 — the back of the arrow: a short tail stub, kept clear of the speed number.
  const backStartR = 20, backEndR = 32;
  const backX1 = cx+backStartR*dirX, backY1 = cy+backStartR*dirY;
  const backX2 = cx+backEndR*dirX, backY2 = cy+backEndR*dirY;
  // Part 2 — the middle shaft — deliberately not drawn, so the wind speed stays visible.
  // Part 3 — the arrowhead: a clean triangle with its point exactly at tipR (no overshoot,
  // since it's plain geometry rather than a stroked line with a rounded cap).
  const tipR = r*0.86, headLen = 12, halfWidth = 6.5;
  const tipX = cx+tipR*dirX, tipY = cy+tipR*dirY;
  const baseR = tipR-headLen;
  const baseX = cx+baseR*dirX, baseY = cy+baseR*dirY;
  const leftX = baseX+halfWidth*perpX, leftY = baseY+halfWidth*perpY;
  const rightX = baseX-halfWidth*perpX, rightY = baseY-halfWidth*perpY;
  return `<svg viewBox="0 0 ${size} ${size}" width="120" height="120">
    <circle cx="${cx}" cy="${cy}" r="${r}" fill="none" stroke="var(--line)" stroke-width="1.5"/>
    <text x="${cx}" y="${cy-r-6}" font-size="10" fill="var(--muted)" text-anchor="middle" font-weight="700">N</text>
    <text x="${cx}" y="${cy+r+14}" font-size="10" fill="var(--muted)" text-anchor="middle" font-weight="700">S</text>
    <text x="${cx-r-10}" y="${cy+4}" font-size="10" fill="var(--muted)" text-anchor="middle" font-weight="700">W</text>
    <text x="${cx+r+10}" y="${cy+4}" font-size="10" fill="var(--muted)" text-anchor="middle" font-weight="700">E</text>
    <line x1="${backX1.toFixed(1)}" y1="${backY1.toFixed(1)}" x2="${backX2.toFixed(1)}" y2="${backY2.toFixed(1)}" stroke="#3E6FE0" stroke-width="3" stroke-linecap="round"/>
    <polygon points="${tipX.toFixed(1)},${tipY.toFixed(1)} ${leftX.toFixed(1)},${leftY.toFixed(1)} ${rightX.toFixed(1)},${rightY.toFixed(1)}" fill="#3E6FE0"/>
    <text x="${cx}" y="${cy+3}" font-size="15" fill="var(--ink)" text-anchor="middle" font-weight="800">${kmh!==null&&kmh!==undefined?Math.round(kmh):'--'}</text>
    <text x="${cx}" y="${cy+15}" font-size="8" fill="var(--muted)" text-anchor="middle">km/h</text>
  </svg>`;
}
function sunArcSVG(sunriseIso, sunsetIso, isToday){
  if(!sunriseIso || !sunsetIso) return `<div class="empty">No daylight data.</div>`;
  const toMin = iso => { const [hh,mm]=iso.slice(11,16).split(':').map(Number); return hh*60+mm; };
  const sunriseMin = toMin(sunriseIso), sunsetMin = toMin(sunsetIso);
  const totalMin = sunsetMin - sunriseMin;
  let nowMin = null;
  if(isToday){ const n=new Date(); nowMin = n.getHours()*60+n.getMinutes(); }
  const w=560,h=140,padX=20;
  const x0=padX,y0=h-24,x1=w/2,y1=14,x2=w-padX,y2=h-24;
  let dotX=null,dotY=null;
  if(nowMin!==null && nowMin>=sunriseMin && nowMin<=sunsetMin && totalMin>0){
    const t=(nowMin-sunriseMin)/totalMin;
    dotX=(1-t)*(1-t)*x0+2*(1-t)*t*x1+t*t*x2;
    dotY=(1-t)*(1-t)*y0+2*(1-t)*t*y1+t*t*y2;
  }
  let svg=`<svg viewBox="0 0 ${w} ${h}" width="100%" height="140" xmlns="http://www.w3.org/2000/svg">`;
  svg+=`<line x1="${padX}" y1="${h-24}" x2="${w-padX}" y2="${h-24}" stroke="var(--line)" stroke-dasharray="3,3"/>`;
  svg+=`<path d="M${x0},${y0} Q${x1},${y1} ${x2},${y2}" fill="none" stroke="var(--line)" stroke-width="2.5"/>`;
  if(dotX!==null){ svg+=`<circle cx="${dotX.toFixed(1)}" cy="${dotY.toFixed(1)}" r="7" fill="#F5C400" stroke="#fff" stroke-width="2"/>`; }
  svg+=`<text x="${padX}" y="${h-4}" font-size="11" fill="var(--muted)" font-weight="700">${fmtHMLocal(sunriseIso)}</text>`;
  svg+=`<text x="${w-padX}" y="${h-4}" font-size="11" fill="var(--muted)" font-weight="700" text-anchor="end">${fmtHMLocal(sunsetIso)}</text>`;
  svg+=`</svg>`;
  return svg;
}

async function loadWeatherIfNeeded(){
  if(WEATHER.status==='loading') return;
  if(WEATHER.fetchedDate===todayISO() && WEATHER.days.length) return;
  WEATHER.status='loading'; render();
  try{
    const coords = await getCoords();
    const params = `latitude=${coords.lat}&longitude=${coords.lon}&hourly=temperature_2m,precipitation,precipitation_probability,weathercode,windspeed_10m,winddirection_10m&daily=sunrise,sunset&temperature_unit=celsius&windspeed_unit=kmh&timezone=auto&forecast_days=7`;
    // Open-Meteo's own default "best match" endpoint auto-selects the highest-resolution
    // model available for the exact coordinates given, which is generally more accurate
    // for current/near-term conditions than forcing one specific coarse global model — so
    // that's tried first. BOM and ECMWF are kept only as fallbacks if the default call fails.
    let json = null, usedSource = '';
    try{
      const res = await fetch(`https://api.open-meteo.com/v1/forecast?${params}`);
      if(res.ok){
        const j = await res.json();
        if(j.hourly && Array.isArray(j.hourly.temperature_2m) && j.hourly.temperature_2m.some(v=>v!==null && v!==undefined)){
          json = j; usedSource = 'Open-Meteo (best match)';
        }
      }
    }catch(err){ /* fall through */ }
    if(!json){
      try{
        const bomRes = await fetch(`https://api.open-meteo.com/v1/forecast?${params}&models=bom_access_global`);
        if(bomRes.ok){
          const bomJson = await bomRes.json();
          if(bomJson.hourly && Array.isArray(bomJson.hourly.temperature_2m) && bomJson.hourly.temperature_2m.some(v=>v!==null && v!==undefined)){
            json = bomJson; usedSource = 'Bureau of Meteorology';
          }
        }
      }catch(bomErr){ /* fall through */ }
    }
    if(!json){
      const ecmwfRes = await fetch(`https://api.open-meteo.com/v1/forecast?${params}&models=ecmwf_ifs025`);
      if(!ecmwfRes.ok) throw new Error('bad response');
      json = await ecmwfRes.json();
      usedSource = 'ECMWF — other sources temporarily unavailable';
    }
    WEATHER.days = groupHourly(json.hourly);
    WEATHER.dailyByDate = groupDaily(json.daily);
    WEATHER.place = coords.place;
    WEATHER.source = usedSource;
    WEATHER.fetchedDate = todayISO();
    WEATHER.status='ready'; WEATHER.error=null;
  }catch(e){
    WEATHER.status='error';
    WEATHER.error = 'Could not load weather — check your internet connection and try again.';
  }
  render();
}
function tempLineGraphSVG(hours, useF){
  const w=700, h=210, padL=34, padR=12, padT=16, padB=26;
  const temps = hours.map(hh=> useF? cToF(hh.tempC) : hh.tempC);
  const rawMin = Math.min(...temps), rawMax = Math.max(...temps);
  let min = Math.floor(rawMin/5)*5, max = Math.ceil(rawMax/5)*5;
  if(max===min) max = min+5;
  const range = max-min;
  const innerW = w-padL-padR, innerH = h-padT-padB;
  const stepX = hours.length>1 ? innerW/(hours.length-1) : 0;
  const points = temps.map((t,i)=>{
    const x = padL + i*stepX;
    const y = padT + (1 - (t-min)/range)*innerH;
    return [x,y];
  });
  const pathD = points.map((p,i)=> (i===0?'M':'L')+p[0].toFixed(1)+','+p[1].toFixed(1)).join(' ');
  const areaD = pathD + ` L${points[points.length-1][0].toFixed(1)},${h-padB} L${points[0][0].toFixed(1)},${h-padB} Z`;
  let svg = `<svg viewBox="0 0 ${w} ${h}" width="100%" height="210" xmlns="http://www.w3.org/2000/svg">`;
  for(let g=min; g<=max; g+=5){
    const y = padT + (1 - (g-min)/range)*innerH;
    svg += `<line x1="${padL}" y1="${y.toFixed(1)}" x2="${w-padR}" y2="${y.toFixed(1)}" stroke="#E4E2F0" stroke-width="1"/>`;
    svg += `<text x="2" y="${(y+3).toFixed(1)}" font-size="9" fill="#6E6C87">${g}°${useF?'F':'C'}</text>`;
  }
  svg += `<path d="${areaD}" fill="#4C3F91" opacity="0.09"/>`;
  svg += `<path d="${pathD}" fill="none" stroke="#4C3F91" stroke-width="2.5" stroke-linejoin="round"/>`;
  points.forEach((p,i)=>{
    const hh = hours[i];
    svg += `<circle cx="${p[0].toFixed(1)}" cy="${p[1].toFixed(1)}" r="9" fill="transparent" style="cursor:pointer;" data-temp-dot="1" data-temp-value="${Math.round(temps[i])}" data-temp-time="${hh.time}"/>`;
    svg += `<circle cx="${p[0].toFixed(1)}" cy="${p[1].toFixed(1)}" r="2.6" fill="#4C3F91" style="pointer-events:none;"/>`;
  });
  hours.forEach((hh,i)=>{
    if(i%3===0 || i===hours.length-1){
      svg += `<text x="${points[i][0].toFixed(1)}" y="${h-8}" font-size="9" fill="#6E6C87" text-anchor="middle">${fmtTimeDisplay(hh.time)}</text>`;
    }
  });
  svg += `</svg>`;
  return svg;
}

  const repHour = pickRepHour(day);

  html += `<div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:14px;margin-bottom:20px;">

    <div class="panel" style="margin:0;text-align:center;">
      <div class="panel-head" style="justify-content:center;"><h3 style="font-size:13px;">💨 Wind Speed</h3></div>
      ${windCompassSVG(repHour.windDeg, repHour.windKmh)}
    </div>
  </div>`;
  html += `<div class="panel">`;
  day.hours.forEach(h=>{
    const rain = rainLabel(h.precip, h.code, h.precipProb);
    html += `<div class="row">
      <div style="width:56px;font-weight:600;">${fmtTimeDisplay(h.time)}</div>
      <div style="width:90px;font-weight:700;">${Math.round(useF?cToF(h.tempC):h.tempC)}°${useF?'F':'C'}</div>
      <div class="title" style="font-size:12.5px;color:${weatherColor(h.code)};font-weight:600;">${weatherDesc(h.code)}</div>

      ${rain?`<span class="duebadge" style="background:#3E6FE0;">${rain}</span>`:''}
    </div>`;
  });
  html += `</div>`;
  return html;
}

function fmtHMS(ms){
  const totalSec = Math.max(0,Math.floor(ms/1000));
  const h = Math.floor(totalSec/3600), m = Math.floor((totalSec%3600)/60), s = totalSec%60;
  return (h>0?pad2(h)+':':'')+pad2(m)+':'+pad2(s);
}

    <div class="field" style="max-width:300px;margin:0 auto 10px;text-align:left;"><label>What are you working on?</label><input type="text" id="focusLabel" placeholder="" value="${escapeAttr(f.label)}"></div>
    <label style="display:flex;align-items:center;gap:8px;justify-content:center;font-size:12.5px;color:var(--muted);margin-bottom:16px;">
      <div class="toggleswitch ${f.auto?'on':''}" data-focus-toggle-auto="1" style="width:36px;height:20px;"><div class="knob" style="width:16px;height:16px;"></div></div>
      Automatically start next session
    </label>
    <div class="field" style="max-width:300px;margin:0 auto 14px;text-align:left;"><label>Sound when a session ends</label>
      <label class="btn btn-outline" for="focusSoundFile" style="display:inline-block;cursor:pointer;width:auto;padding:8px 16px;">Choose sound file</label>
      <input type="file" id="focusSoundFile" accept="audio/*" style="display:none;">
      ${DB.meta.focusSound?`<div style="font-size:11.5px;color:var(--ok);margin-top:4px;">✓ Sound uploaded</div>`:''}
    </div>
    <button class="clockbtn go" style="width:100%;border-radius:14px;" data-focus-start="1">Start focus session</button>`;
  } else {
    html += `<div style="font-size:13px;font-weight:700;letter-spacing:.05em;color:var(--muted);margin-bottom:4px;">FOCUS SESSION</div>
    <div class="bigtime" id="focusDisplay">${fmtHMS(remaining)}</div>
    <div style="font-size:16px;font-weight:700;margin-bottom:10px;">${phaseLabel}</div>
    ${s?`<div style="font-size:13.5px;color:${s.color};font-weight:600;">${s.showEmoji!==false?s.emoji+' ':''}${escapeHtml(s.name)}</div>`:''}
    ${f.label?`<div style="font-size:12.5px;color:var(--muted);margin-bottom:10px;">${escapeHtml(f.label)}</div>`:''}
    <div class="clockbtnrow" style="margin-top:16px;">
      <button class="clockbtn ${f.running?'stopred':'go'}" data-focus-toggle="1">${f.running?'Pause':'Resume'}</button>
      <button class="clockbtn neutral" data-focus-stop="1">End session</button>
    </div>`;
  }
  html += `</div>`;
  return html;
}
function fmtDurationShort(seconds){
  seconds = Math.round(seconds||0);
  const h = Math.floor(seconds/3600), m = Math.floor((seconds%3600)/60);
  if(h>0) return h+'h '+m+'m';
  if(m>0) return m+'m';
  return seconds+'s';
}
function getSubjWeekly(s){ if(!s.studyWeekly || s.studyWeekly.weekStart!==mondayOf(todayISO())) return 0; return s.studyWeekly.seconds; }
function getSubjDaily(s){ if(!s.studyDaily || s.studyDaily.date!==todayISO()) return 0; return s.studyDaily.seconds; }
function getSubjMonthly(s){ if(!s.studyMonthly || s.studyMonthly.month!==monthOf(todayISO())) return 0; return s.studyMonthly.seconds; }
function accumulateSubjectTime(s, seconds){
  if(seconds<=0) return;
  s.studyTime = (s.studyTime||0)+seconds;
  if(!s.studyWeekly || s.studyWeekly.weekStart!==mondayOf(todayISO())) s.studyWeekly={weekStart:mondayOf(todayISO()), seconds:0};
  s.studyWeekly.seconds += seconds;
  if(!s.studyDaily || s.studyDaily.date!==todayISO()) s.studyDaily={date:todayISO(), seconds:0};
  s.studyDaily.seconds += seconds;
  if(!s.studyMonthly || s.studyMonthly.month!==monthOf(todayISO())) s.studyMonthly={month:monthOf(todayISO()), seconds:0};
  s.studyMonthly.seconds += seconds;
}

      const note = findNoteById(STATE.editingNoteId);

      if(optId==='__true__') value = true;

      if(note){
        const q = note.quiz.questions.find(x=>x.id===qId);
        note.attempt.answers[qId] = {value, skipped:false};
        const correct = gradeAnswer(q, note.attempt.answers[qId]);

let rteListClickState = {count:0, lastTime:0};
function getCurrentListType(ed){
  const sel = window.getSelection();
  if(!sel.rangeCount) return 'none';
  let node = sel.anchorNode;
  if(node && node.nodeType===3) node = node.parentElement;
  while(node && node!==ed && ed.contains(node)){
    if(node.tagName==='UL' && node.classList.contains('edchecklist')) return 'checklist';
    if(node.tagName==='UL') return 'ul';
    if(node.tagName==='OL') return 'ol';
    node = node.parentElement;
  }
  return 'none';
}
function removeChecklistAt(ed){
  const sel = window.getSelection();
  if(!sel.rangeCount) return;
  let node = sel.anchorNode;
  if(node && node.nodeType===3) node = node.parentElement;
  let ul = null;
  while(node && node!==ed && ed.contains(node)){
    if(node.tagName==='UL' && node.classList.contains('edchecklist')){ ul = node; break; }
    node = node.parentElement;
  }
  if(!ul) return;
  const lines = Array.from(ul.querySelectorAll('li')).map(li=>{
    const clone = li.cloneNode(true);
    const cb = clone.querySelector('input[type="checkbox"]'); if(cb) cb.remove();
    return clone.textContent.trim();
  });
  const div = document.createElement('div');
  div.innerHTML = lines.map(l=> l ? escapeHtml(l) : '<br>').join('<br>');
  ul.replaceWith(div);
  const range = document.createRange();
  range.selectNodeContents(div);
  range.collapse(false);
  sel.removeAllRanges();
  sel.addRange(range);
}
function clearCurrentList(ed, currentType){
  if(currentType==='ul') document.execCommand('insertUnorderedList');
  else if(currentType==='ol') document.execCommand('insertOrderedList');
  else if(currentType==='checklist') removeChecklistAt(ed);
}
function applyRte(cmd){
  const ed = getActiveEditable(); if(!ed) return; ed.focus();
  const sel = window.getSelection();
  if(savedRteRange){ sel.removeAllRanges(); sel.addRange(savedRteRange); }
  if(cmd==='list-cycle'){
    const now = Date.now();
    const fresh = (now - rteListClickState.lastTime > 1000);
    rteListClickState.lastTime = now;
    rteListClickState.count = fresh ? 1 : ((rteListClickState.count % 3) + 1);
    const currentType = getCurrentListType(ed);
    if(fresh){
      // A fresh click just toggles whatever is currently active off; if nothing is active, turn bullets on.
      if(currentType==='none') document.execCommand('insertUnorderedList');
      else clearCurrentList(ed, currentType);
      return;
    }
    // Continuing a rapid click sequence: swap out whatever is active for the next format in the cycle.
    clearCurrentList(ed, currentType);
    if(rteListClickState.count===1) document.execCommand('insertUnorderedList');
    else if(rteListClickState.count===2) document.execCommand('insertOrderedList');
    else document.execCommand('insertHTML', false, '<ul class="edchecklist"><li><input type="checkbox">&nbsp;</li></ul>');
    return;
  }
  if(cmd==='checklist'){
    document.execCommand('insertHTML', false, '<ul class="edchecklist"><li><input type="checkbox">&nbsp;</li></ul>');
    return;
  }
  if(cmd==='image'){
    const inp = document.createElement('input'); inp.type='file'; inp.accept='image/*';
    inp.onchange = ()=>{
      const file = inp.files[0]; if(!file) return;
      const reader = new FileReader();
      reader.onload = ()=>{
        document.execCommand('insertImage', false, reader.result);
        // Give the freshly-inserted image an explicit, sane default size (inline, so it
        // travels with the saved HTML and looks the same wherever it's rendered), and let
        // the user resize it afterwards via the small size picker that appears on click.
        document.querySelectorAll('.rte-editor img, [contenteditable] img').forEach(img=>{
          if(!img.dataset.sized){
            img.dataset.sized = '1';
            img.style.width = '280px';
            img.style.height = 'auto';
            img.style.borderRadius = '8px';
            img.style.margin = '6px 0';
          }
        });
      };
      reader.readAsDataURL(file);
    };
    inp.click();
    return;
  }
  document.execCommand(cmd, false, null);
  savedRteRange = sel.rangeCount ? sel.getRangeAt(0).cloneRange() : savedRteRange;
}

let WORDLIST_TARGET = null; // null = global DB.definitions; {noteId} = a notebook's keyTerms list
function getWordList(){
  if(WORDLIST_TARGET && WORDLIST_TARGET.noteId){
    const note = findNoteById(WORDLIST_TARGET.noteId);
    if(!note) return DB.definitions;
    if(!note.keyTerms) note.keyTerms = [];
    return note.keyTerms;
  }
  return DB.definitions;
}
function isSlideEmpty(slide){
  if(!slide || !slide.boxes || slide.boxes.length===0) return true;
  return slide.boxes.every(b=>{
    if(b.type==='image') return !b.src;
    const text = (b.text||'').replace(/<[^>]*>/g,'').trim();
    return text.length===0;
  });
}
function findNoteById(noteId){
  for(const sId in DB.revisionNotes){
    for(const nb of (DB.revisionNotes[sId]||[])){
      const it = (nb.items||[]).find(x=>x.id===noteId);
      if(it) return it;
    }
  }
  return null;
}
function findNotebookById(notebookId){
  for(const sId in DB.revisionNotes){ const nb=(DB.revisionNotes[sId]||[]).find(x=>x.id===notebookId); if(nb) return nb; }
  return null;
}
function findNotebookOfItem(itemId){
  for(const sId in DB.revisionNotes){
    for(const nb of (DB.revisionNotes[sId]||[])){
      if((nb.items||[]).some(x=>x.id===itemId)) return nb;
    }
  }
  return null;
}

function openBlockEditModal(week, day, blockId){
  const current = DB.timetable[week][day].find(b=>b.id===blockId);
  if(!current) return;
  const currentVal = current.label;
  document.getElementById('modalRoot').innerHTML = `<div class="overlay" id="ttOverlay"><div class="modal">
    <h3>🗓️ ${day} · ${week==='week1'?'Week 1':'Week 2'}</h3>
    <div class="field"><label>What is this?</label>
      <input id="ttLabel" list="subjectNamesList" placeholder="e.g. Chapel, or PDHPE Prac" value="${escapeAttr(currentVal||'')}">
      <datalist id="subjectNamesList">${DB.subjects.map(s=>`<option value="${escapeAttr(s.name)}">`).join('')}</datalist>
      <div style="font-size:11px;color:var(--muted);margin-top:4px;">Tip: type a subject name followed by anything else (e.g. "PDHPE Prac", "PDHPE Theory") and it'll take that subject's colour without creating a new subject.</div>
    </div>
    <div class="row2">
      <div class="field"><label>Start</label><input id="ttStart" type="time" value="${current.start}"></div>
      <div class="field"><label>End</label><input id="ttEnd" type="time" value="${current.end}"></div>
    </div>
    <div class="modalfoot">
      <button class="btn btn-danger" id="ttDelete" style="margin-right:auto;">Delete</button>
      <button class="btn btn-ghost" id="ttCancel">Cancel</button><button class="btn btn-brand" id="ttSave">Save</button>
    </div>
  </div></div>`;
  document.getElementById('ttCancel').onclick = closeModal;
  document.getElementById('ttOverlay').onclick = (e)=>{ if(e.target.id==='ttOverlay') closeModal(); };
  document.getElementById('ttDelete').onclick = async ()=>{
    DB.timetable[week][day] = DB.timetable[week][day].filter(b=>b.id!==blockId);
    await saveData(); closeModal(); render();
  };
  document.getElementById('ttSave').onclick = async ()=>{
    const start = document.getElementById('ttStart').value, end = document.getElementById('ttEnd').value;
    const raw = document.getElementById('ttLabel').value.trim();
    const lower = raw.toLowerCase();
    // Match a subject if the typed text IS the subject name, or STARTS WITH the subject name
    // (e.g. "PDHPE Prac" and "PDHPE Theory" both match the "PDHPE" subject for colour),
    // preferring the longest matching subject name so more specific names win.
    let match = null;
    DB.subjects.forEach(s=>{
      const nameLower = s.name.toLowerCase();
      if(lower===nameLower || lower.startsWith(nameLower+' ')){
        if(!match || s.name.length>match.name.length) match = s;
      }
    });
    const startMin = timeToMinutes(start), endMin = timeToMinutes(end);
    const overlapping = DB.timetable[week][day].find(b=>b.id!==blockId && timeToMinutes(b.start)<endMin && timeToMinutes(b.end)>startMin);

      current.start = start; current.end = end;

    if(overlapping){
      document.getElementById('modalRoot').innerHTML = `<div class="overlay" id="ttOverlapOverlay"><div class="modal">

}
function fmtTime12(t24){
  if(!t24) return '';
  let [h,m] = t24.split(':').map(Number);
  const ampm = h>=12?'pm':'am';
  h = h%12; if(h===0) h=12;
  return h+(m===0?'':':'+pad2(m))+ampm;
}
function fmtTimeDisplay(t24){
  if(!t24) return '';

  return fmtTime12(t24);
}

  err.classList.add('show');

function stripTrailingEmptyLines(html){
  let out = html||'';
  let changed = true;
  while(changed){
    changed = false;
    const noTrailingBr = out.replace(/(<br\s*\/?>|&nbsp;|\s)+$/i, m=> /<br/i.test(m) ? '' : m);
    if(noTrailingBr !== out){ out = noTrailingBr; changed = true; continue; }
    const blockMatch = out.match(/<(div|p)[^>]*>(\s|&nbsp;|<br\s*\/?>)*<\/\1>\s*$/i);
    if(blockMatch){ out = out.slice(0, blockMatch.index); changed = true; }
  }
  return out;
}
function recordRecentColor(hex){
  if(!hex || !/^#[0-9a-fA-F]{6}$/.test(hex)) return;
  hex = hex.toUpperCase();
  DB.meta.recentColors = [hex, ...(DB.meta.recentColors||[]).filter(c=>c!==hex)].slice(0,6);
  saveData();
}
function enhanceColorInputs(){
  if(enhanceColorInputs._running) return;
  enhanceColorInputs._running = true;
  try{
    document.querySelectorAll('input[type=color]').forEach(inp=>{
      if(inp.dataset.recentWired) return;
      // Only the big standalone colour pickers (Schedule box, Add Subject) get the
      // "last 6 colours" row — compact swatches (per-subject rows, RTE toolbar icons)
      // stay untouched so they don't get overwhelmed by a wide swatch bar.
      if(inp.closest('.subjrow') || inp.closest('.rtetoolbar') || inp.closest('.rte-color-btn') || inp.closest('.rte-mini-toolbar')) return;
      inp.dataset.recentWired = '1';
      inp.addEventListener('change', ()=>{ recordRecentColor(inp.value); refreshRecentColorRows(); });
      const row = document.createElement('div');
      row.className = 'recentcolors';
      row.dataset.recentcolorsFor = '1';
      inp.insertAdjacentElement('afterend', row);
    });
    refreshRecentColorRows();
  } finally {
    enhanceColorInputs._running = false;
  }
}
function refreshRecentColorRows(){
  const colors = DB.meta.recentColors||[];
  document.querySelectorAll('.recentcolors').forEach(row=>{
    if(!colors.length){ if(row.style.display!=='none') row.style.display='none'; return; }
    if(row.dataset.renderedColors===colors.join(',')) return;
    row.dataset.renderedColors = colors.join(',');
    row.style.display='flex';
    const inp = row.previousElementSibling;
    row.innerHTML = colors.map(c=>`<button type="button" style="background:${c};" data-recent-color="${c}" title="${c}"></button>`).join('');
    row.querySelectorAll('[data-recent-color]').forEach(btn=>{
      btn.onclick = ()=>{
        inp.value = btn.dataset.recentColor;
        inp.dispatchEvent(new Event('input', {bubbles:true}));
        inp.dispatchEvent(new Event('change', {bubbles:true}));
      };
    });
  });
}
function lightenBlockColor(hex){
  if(!hex) return '#EFEBFF';
  if(hex.length===9) return hex; // already has alpha
  if(hex.length===7) return hex+'33'; // ~20% opacity, keeps it light & transparent
  return hex;
}

function playBeep(){
  try{
    const ctx = new (window.AudioContext||window.webkitAudioContext)();
    const osc = ctx.createOscillator(); const gain = ctx.createGain();
    osc.connect(gain); gain.connect(ctx.destination);
    osc.frequency.value = 880; gain.gain.value = 0.2;
    osc.start(); osc.stop(ctx.currentTime+0.6);
  }catch(e){}
}
function playSound(dataUrl){
  if(dataUrl){ try{ new Audio(dataUrl).play(); }catch(e){ playBeep(); } }
  else playBeep();
}
function fastTick(){
  const homeClockEl = document.getElementById('homeClockStr');
  if(homeClockEl) homeClockEl.textContent = homeClockString();
  const pqSw = document.getElementById('pqStopwatch');
  if(pqSw){
    const started = parseInt(pqSw.dataset.pqStarted,10);
    const elapsed = Math.floor((Date.now()-started)/1000);
    const mm = String(Math.floor(elapsed/60)).padStart(2,'0'), ss = String(elapsed%60).padStart(2,'0');
    pqSw.textContent = `⏱ ${mm}:${ss}`;
  }
  if(STATE.sw.running){
    const el = document.getElementById('swDisplay');
    if(el) el.textContent = fmtHMS(STATE.sw.elapsed + (Date.now()-STATE.sw.startedAt));
  }
  if(STATE.timer.running){
    const remaining = Math.max(0, STATE.timer.endAt-Date.now());
    const el = document.getElementById('timerDisplay');
    if(el) el.textContent = fmtHMS(remaining);
    if(remaining<=0){
      STATE.timer.running=false; STATE.timer.remainingMs=0;
      playSound(DB.meta.timerSound);
      render();
    }
  }
  if(STATE.subjTimer.activeId && STATE.subjTimer.status==='running'){
    const s = subj(STATE.subjTimer.activeId);
    if(s){
      const el = document.getElementById('subjTimerElapsed-'+s.id);
      if(el) el.textContent = fmtHMS(STATE.subjTimer.elapsedMs + (Date.now()-STATE.subjTimer.startedAt));
    }
  }
  if(STATE.focus.running){
    const remaining = Math.max(0, STATE.focus.endAt-Date.now());
    const el = document.getElementById('focusDisplay');
    if(el) el.textContent = fmtHMS(remaining);
    if(remaining<=0){
      const wasWork = STATE.focus.phase==='work';
      if(wasWork && STATE.focus.subjectId){
        const s = subj(STATE.focus.subjectId);
        if(s) accumulateSubjectTime(s, STATE.focus.workMin*60);
      }
      playSound(DB.meta.focusSound || (wasWork ? DB.meta.timerSound : DB.meta.alarmSound));
      if(STATE.focus.auto){
        STATE.focus.phase = wasWork ? 'break' : 'work';
        const mins = STATE.focus.phase==='work' ? STATE.focus.workMin : STATE.focus.breakMin;
        STATE.focus.remainingMs = mins*60000; STATE.focus.endAt = Date.now()+mins*60000; STATE.focus.running=true;
      } else {
        STATE.focus.running=false; STATE.focus.remainingMs=0;
      }
      saveData();
      render();
    }
  }
  if(DB && DB.meta.alarmEnabled && DB.meta.alarmTime){
    const now = new Date();
    const hhmm = pad2(now.getHours())+':'+pad2(now.getMinutes());
    if(hhmm===DB.meta.alarmTime && alarmFiredMinute!==hhmm){
      alarmFiredMinute = hhmm;
      playSound(DB.meta.alarmSound);
    }
  }
}

  const err = document.getElementById('accessErr');
  const card = document.querySelector('#accessScreen .lockcard');
  async function tryAccess(){
    const code = input.value.trim().toUpperCase();
    if(code.length !== 6){
      err.textContent = 'This is not a valid code!';
      card.classList.remove('shake'); void card.offsetWidth; card.classList.add('shake');
      input.value=''; input.focus();
      return;
    }
    const button = document.getElementById('accessSubmit');
    button.disabled = true;
    err.textContent = '';
    try{
      const result = await chilleAccessRequest('redeem', {code});
      if(result.status === 'ok'){
        localStorage.setItem('chille-access-granted-v2','1');
        DB.meta.accessGranted = true;
        DB.meta.accessCode = '';
        await saveData();
        screen.classList.remove('show');
        showOnboarding();
        return;
      }
      if(result.status === 'already_used') err.textContent = 'This code has already been used!';
      else err.textContent = "This code doesn't match";
    }catch(e){
      err.textContent = 'Could not verify the code. Please try again.';
    }finally{
      button.disabled = false;
      input.value=''; input.focus();
      card.classList.remove('shake'); void card.offsetWidth; card.classList.add('shake');
    }
  }
  document.getElementById('accessSubmit').onclick = tryAccess;
  input.onkeydown = (e)=>{ if(e.key==='Enter') tryAccess(); };
  setTimeout(()=>input.focus(), 50);

  const colors = ['#4C3F91','#7A6BC4','#2FAE73','#E6C200','#D64545','#3E6FE0','#D6A4E0'];
  const container = document.createElement('div');
  container.style.cssText = 'position:fixed;inset:0;z-index:9999;pointer-events:none;overflow:hidden;';
  document.body.appendChild(container);
  const count = 140;
  for(let i=0;i<count;i++){
    const piece = document.createElement('div');
    const size = 6 + Math.random()*7;
    const isCircle = Math.random()<0.4;
    piece.style.cssText = `position:absolute;top:-20px;left:${Math.random()*100}%;width:${size}px;height:${size*(isCircle?1:0.5)}px;background:${colors[Math.floor(Math.random()*colors.length)]};border-radius:${isCircle?'50%':'2px'};opacity:${0.8+Math.random()*0.2};transform:rotate(${Math.random()*360}deg);`;
    const duration = 1.6 + Math.random()*1.2;
    const delay = Math.random()*0.4;
    const drift = (Math.random()-0.5)*200;
    piece.animate([
      {transform:`translate(0,0) rotate(0deg)`, opacity:1},
      {transform:`translate(${drift}px, 100vh) rotate(${360+Math.random()*360}deg)`, opacity:0.9}
    ], {duration:duration*1000, delay:delay*1000, easing:'cubic-bezier(.25,.46,.45,.94)', fill:'forwards'});
    container.appendChild(piece);
  }
  setTimeout(()=>container.remove(), 2200);
}
function showLockScreen(){
  const ls = document.getElementById('lockScreen');
  ls.classList.add('show');
  const input = document.getElementById('lockInput');
  const err = document.getElementById('lockErr');
  const card = document.querySelector('.lockcard');
  const lockMain = document.getElementById('lockMain');
  const lockForgot = document.getElementById('lockForgot');
  const forgotLink = document.getElementById('forgotPinLink');
  function tryUnlock(){
    if(simpleHash(input.value)===DB.meta.pinHash){
      sessionStorage.setItem('chille-unlocked-v1','1');
      ls.classList.remove('show');
      startApp();
    } else {
      err.textContent = 'Wrong passcode — try again.';
      card.classList.remove('shake'); void card.offsetWidth; card.classList.add('shake');
      input.value=''; input.focus();
    }
  }
  document.getElementById('lockSubmit').onclick = tryUnlock;
  input.onkeydown = (e)=>{ if(e.key==='Enter') tryUnlock(); };
  setTimeout(()=>input.focus(), 50);

  forgotLink.style.display = DB.meta.securityQuestion ? 'inline-block' : 'none';
  forgotLink.onclick = ()=>{
    lockMain.style.display='none';
    lockForgot.style.display='block';
    document.getElementById('lockForgotQ').textContent = DB.meta.securityQuestion || '';
    document.getElementById('forgotAnswerInput').value='';
    document.getElementById('forgotErr').textContent='';
    document.getElementById('forgotReveal').style.display='none';
    setTimeout(()=>document.getElementById('forgotAnswerInput').focus(), 50);
  };
  document.getElementById('backToPinLink').onclick = ()=>{
    lockForgot.style.display='none';
    lockMain.style.display='block';
    input.value=''; input.focus();
  };
  function checkAnswer(){
    const given = document.getElementById('forgotAnswerInput').value.trim().toLowerCase();
    const correct = (DB.meta.securityAnswer||'').trim().toLowerCase();
    const forgotErr = document.getElementById('forgotErr');
    if(given && given===correct){
      forgotErr.textContent='';
      const reveal = document.getElementById('forgotReveal');
      reveal.style.display='block';
      const pinSpan = document.getElementById('revealedPin');
      pinSpan.textContent = '•'.repeat((DB.meta.pinPlain||'').length || 6);
      pinSpan.dataset.shown = '0';
      document.getElementById('togglePinEye').onclick = ()=>{
        const shown = pinSpan.dataset.shown === '1';
        pinSpan.textContent = shown ? '•'.repeat((DB.meta.pinPlain||'').length||6) : (DB.meta.pinPlain||'');
        pinSpan.dataset.shown = shown ? '0' : '1';
      };
    } else {
      forgotErr.textContent = "That doesn't match — try again.";
      card.classList.remove('shake'); void card.offsetWidth; card.classList.add('shake');
    }
  }
  document.getElementById('forgotCheckBtn').onclick = checkAnswer;
  document.getElementById('forgotAnswerInput').onkeydown = (e)=>{ if(e.key==='Enter') checkAnswer(); };
}
(function init(){
  loadData();
  const serverAccessGranted = localStorage.getItem('chille-access-granted-v2') === '1';
  DB.meta.accessGranted = serverAccessGranted;
  if(!serverAccessGranted){
    showAccessGate();
  } else if(!DB.meta.onboardingComplete){
    showOnboarding();
  } else if(DB.meta.pinHash && sessionStorage.getItem('chille-unlocked-v1')!=='1'){
    showLockScreen();
  } else {
    startApp();
  }
})();
</script>
